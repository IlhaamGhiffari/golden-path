name: CI

on:
  push:
    branches: [main]
    paths: ['site/**', 'infra/**', 'k8s/**', '.github/**']
  pull_request:
    paths: ['site/**', 'infra/**', 'k8s/**', '.github/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: site
      - name: Type check
        run: npm run check
        working-directory: site
      - name: Build
        run: npm run build
        working-directory: site
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 7

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scanning
        run: docker build -t golden-path:ci site/
      # SHA-pinned: aquasecurity/trivy-action was supply-chain compromised in
      # Mar 2026 (all tags except v0.35.0 affected). Tag v0.35.0 = this commit.
      - name: Scan image (HIGH/CRITICAL gates push)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: golden-path:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

  # IaC scanning (PLAN 3.3.2): tfsec is deprecated — Trivy fs misconfig is its
  # successor and reuses the same SHA-pinned action as the image scan.
  scan-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan IaC — Terraform + manifests (HIGH/CRITICAL gates)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          skip-dirs: site/node_modules,site/dist,.git,infra/.terraform
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

  # Terraform plan against the real remote state — authenticated via OIDC
  # (PLAN 3.3.1): no client secret anywhere, only federated identity.
  tf-plan:
    needs: scan-iac
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token exchange
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          auth-type: OIDC
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      # state storage key fetched at runtime via the SP's
      # "Storage Account Key Operator" role — never stored as a secret
      - name: Fetch state access key
        run: |
          KEY=$(az storage account keys list -g golden-path-state-rg -n gpstateilhaam --query '[0].value' -o tsv)
          echo "ARM_ACCESS_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Terraform plan (remote state, OIDC auth)
        working-directory: infra
        run: |
          terraform init -no-color
          terraform plan -no-color

  push:
    needs: [scan, scan-iac]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Push image + bump GitOps only when the site itself changed
      # (infra/manifest-only commits must not create image churn).
      - name: Detect site changes
        id: changes
        uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6
        with:
          filters: |
            site:
              - 'site/**'
      - name: Log in to GHCR
        if: steps.changes.outputs.site == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name (GHCR requires lowercase)
        if: steps.changes.outputs.site == 'true'
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push image
        if: steps.changes.outputs.site == 'true'
        uses: docker/build-push-action@v6
        with:
          context: site
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
      # GitOps trigger: bump the image tag in k8s/deployment.yaml and commit.
      # ArgoCD detects the drift and syncs the cluster. The commit message
      # contains [skip ci] so this never re-triggers this workflow.
      - name: Bump image tag in k8s manifests (GitOps)
        if: steps.changes.outputs.site == 'true'
        run: ./scripts/bump-image.sh "${{ github.sha }}"
