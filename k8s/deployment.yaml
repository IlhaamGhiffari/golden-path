apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-path
  namespace: portfolio
  labels:
    app: golden-path
spec:
  replicas: 2
  selector:
    matchLabels:
      app: golden-path
  template:
    metadata:
      labels:
        app: golden-path
    spec:
      # compliant with Pod Security Admission "restricted" (enforced in Phase 3)
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: golden-path
          image: ghcr.io/ilhaamghiffari/golden-path:ffe76472eb3fd16d9e6ebc3c9fb9bb2dc3a4744a
          ports:
            - name: http
              containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-logs
              mountPath: /var/log/nginx
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
        # converts nginx stub_status (plain text) → Prometheus metrics on :9113
        - name: metrics-exporter
          image: nginx/nginx-prometheus-exporter:1.4.0
          args:
            - -nginx.scrape-uri=http://127.0.0.1:80/stub_status
          ports:
            - name: metrics
              containerPort: 9113
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-logs
          emptyDir: {}
