apiVersion: v1
kind: Service
metadata:
  name: golden-path
  namespace: portfolio
  labels:
    app: golden-path # ServiceMonitor selects the Service by label
spec:
  selector:
    app: golden-path
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9113
      targetPort: metrics
  type: ClusterIP
