apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: golden-path
  namespace: portfolio
  annotations:
    # automatic TLS via cert-manager (ClusterIssuer: letsencrypt-prod)
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ilhaamghiffari.tech
        - www.ilhaamghiffari.tech
      secretName: golden-path-tls
  rules:
    - host: ilhaamghiffari.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: golden-path
                port:
                  name: http
    - host: www.ilhaamghiffari.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: golden-path
                port:
                  name: http
