apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golden-path
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:IlhaamGhiffari/golden-path.git
    targetRevision: main
    path: k8s
    directory:
      recurse: true # include subdirs (cert-manager/, monitoring/) — default is false!
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
