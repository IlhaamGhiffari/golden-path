apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: golden-path
  namespace: portfolio
  labels:
    # kube-prometheus-stack's Prometheus CR selects ServiceMonitors by
    # release label — without this the target is never scraped
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: golden-path
  endpoints:
    - port: http
      path: /stub_status
      interval: 30s
